version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"

  bot:
    build: .
    container_name: car_bot
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal  # Переопределяем для бота
    volumes:
      - .:/app
    command: ["python", "main.py"]
